services:
  db:
    image: mysql:8.0.31
    volumes:
      - ./docker/db/conf.d:/etc/mysql/conf.d
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: bbs
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_RANDOM_ROOT_PASSWORD: 1
  web:
    build:
      context: docker/web
      dockerfile: Dockerfile
    volumes:
      - ./:/app
    ports:
      - "80:80"
    depends_on:
      - db
      - node
    command: /bin/bash -c "
        /usr/local/bin/wait-for-it.sh db:3306 -t 30 -- \
        php artisan migrate && \
        php artisan db:seed && \
        exec /usr/local/bin/apache2-foreground
      "
  node:
    build:
      context: docker/node
      dockerfile: Dockerfile
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    tty: true